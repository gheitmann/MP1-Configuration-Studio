name: Bug report
description: Report a reproducible problem with MP1 Configuration Studio.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include `MediaPortal.xml`, credentials, or personal paths. For security issues, follow SECURITY.md instead.
  - type: input
    id: studio-version
    attributes:
      label: Studio version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - x86
        - Unknown
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: "Windows 11 23H2, 22631.xxxx"
    validations:
      required: true
  - type: input
    id: mediaportal
    attributes:
      label: MediaPortal version
      placeholder: "1.39.x"
    validations:
      required: true
  - type: input
    id: scaling
    attributes:
      label: Display scaling and Studio scale
      placeholder: "Windows 150%, Studio 125%"
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language and theme
      placeholder: "German, dark"
  - type: input
    id: plugin
    attributes:
      label: Plugin and version, if relevant
      placeholder: "Plugin name, version"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start Studio
        2. Open ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I backed up my MediaPortal configuration.
          required: true
        - label: I tried classic mode and recorded whether the problem persists.
          required: true
        - label: I attached a support bundle or explained why I cannot.
        - label: This is not a security issue.
          required: true
