name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading v (for example 1.0.0 or 1.0.0-rc.1)'
        required: true
        default: '1.0.0-rc.1'
      unsigned_waiver:
        description: 'Publish a final version without code signing (documented waiver)'
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: powershell
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'.TrimStart('v')
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Select release notes
        id: notes
        shell: powershell
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $path = "docs/RELEASE-$version.md"
          if (-not (Test-Path -LiteralPath $path)) { $path = 'docs/RELEASE-1.0.1.md' }
          if (-not (Test-Path -LiteralPath $path)) { $path = 'docs/RELEASE-1.0.0.md' }
          "path=$path" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build and test
        shell: powershell
        run: .\build.ps1

      - name: Sign application
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $version = '${{ steps.version.outputs.value }}'
          $allowUnsigned = '${{ inputs.unsigned_waiver }}' -eq 'true' -or '${{ vars.ALLOW_UNSIGNED_FINAL }}' -eq 'true'
          $hasSignPath = '${{ vars.SIGNPATH_ORGANIZATION_ID }}' -ne ''
          if ($env:SIGNING_PFX_BASE64) {
            .\tools\Sign-Studio.ps1 -Target 'dist\MP1ConfigurationStudio.exe' -RequireSignature
          } elseif ($hasSignPath) {
            Write-Output 'Application signing delegated to SignPath.'
          } elseif ($version -notmatch '-' -and -not $allowUnsigned) {
            throw 'Final releases require a signing certificate, SignPath configuration, or the documented ALLOW_UNSIGNED_FINAL waiver.'
          } else {
            Write-Warning 'UNSIGNED RELEASE: no signing certificate configured. The release notes disclose this.'
          }

      - name: Stage unsigned application for SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path 'signpath\app' | Out-Null
          Copy-Item 'dist\MP1ConfigurationStudio.exe' 'signpath\app\MP1ConfigurationStudio.exe' -Force
          Compress-Archive -Path 'signpath\app\MP1ConfigurationStudio.exe' -DestinationPath 'signpath\app.zip' -Force

      - name: Upload unsigned application
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: upload-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: signpath\app.zip

      - name: Sign application via SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: sign-app
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_APP_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-app

      - name: Use signed application
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: powershell
        run: |
          $candidates = @('signed-app\MP1ConfigurationStudio.exe', 'signed-app\app\MP1ConfigurationStudio.exe', 'signed-app\app.zip')
          $found = $null
          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath $candidate) { $found = $candidate; break }
          }
          if (-not $found) { throw 'Signed application not found in the SignPath output.' }
          if ($found -like '*.zip') {
            Expand-Archive -LiteralPath $found -DestinationPath 'signed-app\extracted' -Force
            $exe = Get-ChildItem 'signed-app\extracted' -Recurse -Filter 'MP1ConfigurationStudio.exe' | Select-Object -First 1
            if (-not $exe) { throw 'Signed application executable not found in the SignPath ZIP.' }
            $found = $exe.FullName
          }
          Copy-Item -LiteralPath $found -Destination 'dist\MP1ConfigurationStudio.exe' -Force
          $signature = Get-AuthenticodeSignature -LiteralPath 'dist\MP1ConfigurationStudio.exe'
          if ($signature.Status -ne 'Valid') { throw "SignPath application signature is not valid: $($signature.Status)" }

      - name: Package portable ZIP
        shell: powershell
        run: .\tools\Package-Studio.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build setup executable
        shell: powershell
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" 'packaging\MP1ConfigurationStudio.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Sign setup executable
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $setup = "dist\package\MP1-Configuration-Studio-${{ steps.version.outputs.value }}-Setup.exe"
          if ($env:SIGNING_PFX_BASE64) {
            .\tools\Sign-Studio.ps1 -Target $setup -RequireSignature
          } else {
            Write-Output 'Skipping PFX setup signing.'
          }

      - name: Stage unsigned setup for SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: powershell
        run: |
          $setup = Get-ChildItem 'dist\package' -Filter '*Setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Setup executable not found.' }
          New-Item -ItemType Directory -Force -Path 'signpath\setup' | Out-Null
          Copy-Item -LiteralPath $setup.FullName -Destination (Join-Path 'signpath\setup' $setup.Name) -Force
          Compress-Archive -Path (Join-Path 'signpath\setup' $setup.Name) -DestinationPath 'signpath\setup.zip' -Force

      - name: Upload unsigned setup
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: upload-setup
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: signpath\setup.zip

      - name: Sign setup via SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        id: sign-setup
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_SETUP_CONFIG_SLUG }}
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup

      - name: Use signed setup
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: powershell
        run: |
          $signed = Get-ChildItem 'signed-setup' -Recurse -Filter '*Setup.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $signed) {
            $archive = Get-ChildItem 'signed-setup' -Recurse -Filter '*.zip' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($archive) {
              Expand-Archive -LiteralPath $archive.FullName -DestinationPath 'signed-setup\extracted' -Force
              $signed = Get-ChildItem 'signed-setup\extracted' -Recurse -Filter '*Setup.exe' | Select-Object -First 1
            }
          }
          if (-not $signed) { throw 'Signed setup executable not found in the SignPath output.' }
          Copy-Item -LiteralPath $signed.FullName -Destination (Join-Path 'dist\package' $signed.Name) -Force
          $signature = Get-AuthenticodeSignature -LiteralPath (Join-Path 'dist\package' $signed.Name)
          if ($signature.Status -ne 'Valid') { throw "SignPath setup signature is not valid: $($signature.Status)" }

      - name: Write checksums
        shell: powershell
        run: |
          Get-ChildItem 'dist\package' -File | Where-Object { $_.Extension -in '.zip', '.exe' } | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Set-Content -LiteralPath ($_.FullName + '.sha256') -Encoding ASCII
          }

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
          name: MP1 Configuration Studio ${{ steps.version.outputs.value }}
          body_path: ${{ steps.notes.outputs.path }}
          draft: true
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          files: |
            dist/package/*.zip
            dist/package/*.zip.sha256
            dist/package/*Setup.exe
            dist/package/*Setup.exe.sha256
